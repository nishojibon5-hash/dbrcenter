[build]
  publish = "dist"
  command = "mkdir -p dist && cp -r index.html admin admin.html .htaccess 404.html workshop_building.jpg hero_orange_car.jpg fonts robots.txt sitemap.xml google*.html dist/ 2>/dev/null || true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
