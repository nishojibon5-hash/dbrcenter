<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBR Complete Auto Centre</title>
  <script>
    // GitHub Pages SPA router redirect
    const path = window.location.pathname;
    if(path.toLowerCase().includes('/admin')){
      const repo = path.split('/')[1];
      if(repo && repo.toLowerCase() === 'dbrcenter'){
        window.location.replace('/' + repo + '/#admin');
      } else {
        window.location.replace('/#admin');
      }
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="background:#090B0E;color:#F8FAFC;font-family:sans-serif;text-align:center;padding:50px;">
  <p>লোড হচ্ছে...</p>
</body>
</html>
